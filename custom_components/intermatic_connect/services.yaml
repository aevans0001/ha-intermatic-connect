set_weekly_schedule:
  name: Set weekly schedule
  description: Replace or add the timer's native weekly on/off schedule for a circuit.
  target:
    entity:
      integration: intermatic_connect
      domain: switch
  fields:
    on_time:
      name: On time
      required: true
      selector:
        time:
    off_time:
      name: Off time
      required: true
      selector:
        time:
    days:
      name: Days
      required: true
      example: [monday, tuesday, wednesday, thursday, friday]
      selector:
        select:
          multiple: true
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
    replace:
      name: Replace existing circuit schedule
      default: true
      selector:
        boolean:

set_ascend_schedule:
  name: Set ASCEND schedule
  description: Write native ASCEND events using HH:MM, sunrise, or sunset. Does not change operating mode. Each selected weekday consumes one of 42 slots. An empty list clears the schedule only in Manual mode.
  target:
    entity:
      integration: intermatic_connect
      domain: switch
  fields:
    events:
      name: Events
      description: List of events with time, state (on/off), days, and optional solar offset in minutes (-120 to 120).
      required: true
      example: '[{"time": "sunset", "state": "on", "days": ["monday"], "offset": 30}, {"time": "23:00", "state": "off", "days": ["monday"]}]'
      selector:
        object:
    replace:
      name: Replace entire schedule
      description: When disabled, add events to the timer’s latest reported schedule.
      default: true
      selector:
        boolean:
